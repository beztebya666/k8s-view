apiVersion: v2
name: k8s-view
description: |
  k8s-view — a streaming, multi-cluster Kubernetes dashboard.
  Single Go binary, MessagePack delta WebSocket, side-panel inline actions
  (scale / restart / rollout history & rollback / describe / exec / logs /
  port-forward), Prometheus + metrics-server charts. Production-grade
  defaults, hardened pod, no telemetry.
type: application
# Chart version is bumped on every chart change.
# appVersion tracks the binary release.
version: 0.4.2
appVersion: "v0.4.2"
kubeVersion: ">=1.20.0-0"
home: https://github.com/beztebya666/k8s-view
sources:
  - https://github.com/beztebya666/k8s-view
icon: https://raw.githubusercontent.com/beztebya666/k8s-view/main/frontend/public/favicon.svg
keywords:
  - kubernetes
  - k8s
  - dashboard
  - ui
  - web-ui
  - kubernetes-dashboard
  - kubernetes-ui
  - multi-cluster
  - rollback
  - rollout
  - prometheus
  - metrics-server
  - kubectl
  - observability
  - devops
  - cloud-native
  - self-hosted
maintainers:
  - name: beztebya666
    url: https://github.com/beztebya666
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: monitoring-logging
  artifacthub.io/changes: |
    - kind: fixed
      description: Log viewer — Follow no longer breaks when Wrap or Pretty JSON is enabled; the tail stays pinned as variable-height rows are measured
    - kind: added
      description: Pretty JSON expands embedded JSON — a string value that is itself a JSON object/array is broken out inline into real indented fields
    - kind: changed
      description: Cluster icon editor — one unified picker for the custom photo and emoji presets; both stay on file and can be flipped between without re-uploading
    - kind: fixed
      description: Clicking a hue swatch or icon tile in the cluster icon editor no longer toggles the sidebar cluster section open/closed
    - kind: changed
      description: Confirm/alert/prompt modal widened; the bulk-delete dialog lists the full selection in a box that scrolls both axes
    - kind: changed
      description: The Create (+) button is painted with the cluster's own colour; the multi-select action bar moved to bottom-centre so it never overlaps it
    - kind: removed
      description: All blur / backdrop-blur effects, replaced with opacity-based darkening — no GPU dependency
